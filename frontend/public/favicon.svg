<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="insurtech-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="0.75" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="32" height="32" rx="8" fill="url(#insurtech-grad)" />

  <!-- Subtle shield badge background -->
  <path
    d="M16 6.5C19.8 8.8 22.5 8.9 23.5 9.2C23.7 15.4 20.5 20.8 16 24.5C11.5 20.8 8.3 15.4 8.5 9.2C9.5 8.9 12.2 8.8 16 6.5Z"
    fill="white"
    fill-opacity="0.16"
    stroke="white"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- Active verification / claim security checkmark -->
  <path
    d="M12.5 15.5L15 18L20 12.5"
    stroke="white"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>

