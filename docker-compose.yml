services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insurtech
      POSTGRES_PASSWORD: insurtech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurtech -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1


  auth-service:
    build: ./backend/auth-service
    depends_on: [postgres]
    ports: ["8084:8084"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db

  segurados-service:
    build: ./backend/segurados-service
    depends_on: [postgres]
    ports: ["8085:8085"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/segurados_db

  apolices-service:
    build: ./backend/apolices-service
    depends_on: [postgres]
    ports: ["8086:8086"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apolices_db
      SERVICES_SEGURADOS_URL: http://segurados-service:8085

  sinistros-service:
    build: ./backend/sinistros-service
    depends_on: [postgres, kafka, segurados-service, apolices-service]
    ports: ["8087:8087"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sinistros_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVICES_APOLICES_URL: http://apolices-service:8086
      SERVICES_SEGURADOS_URL: http://segurados-service:8085
      SERVICES_AUTH_URL: http://auth-service:8084

  liquidacao-service:
    build: ./backend/liquidacao-service
    depends_on: [postgres, kafka]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/liquidacao_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  notificacao-service:
    build: ./backend/notificacao-service
    depends_on: [kafka]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  gateway-service:
    build: ./backend/gateway-service
    depends_on: [auth-service, segurados-service, apolices-service, sinistros-service]
    ports: ["8080:8080"]
    environment:
      SERVICES_AUTH_URL: http://auth-service:8084
      SERVICES_SEGURADOS_URL: http://segurados-service:8085
      SERVICES_APOLICES_URL: http://apolices-service:8086
      SERVICES_SINISTROS_URL: http://sinistros-service:8087
#
#  frontend:
#    build: ./frontend
#    ports: ["5173:5173"]
#    depends_on: [gateway-service]

volumes:
  pgdata: